apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: syedfurqanjaved/frontend:latest # Replace with your Docker Hub image
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi" # Request memory (adjust as needed)
            cpu: "250m" # Request CPU (adjust as needed)
          limits:
            memory: "512Mi" # Limit memory (adjust as needed)
            cpu: "500m" # Limit CPU (adjust as needed)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: syedfurqanjaved/backend:latest # Replace with your Docker Hub image
        ports:
        - containerPort: 7001
        resources:
          requests:
            memory: "256Mi" # Request memory (adjust as needed)
            cpu: "250m" # Request CPU (adjust as needed)
          limits:
            memory: "512Mi" # Limit memory (adjust as needed)
            cpu: "500m" # Limit CPU (adjust as needed)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:latest # Using the default Mongo image from Docker Hub
        ports:
        - containerPort: 27017
        resources:
          requests:
            memory: "512Mi" # Request memory (adjust as needed)
            cpu: "500m" # Request CPU (adjust as needed)
          limits:
            memory: "1Gi" # Limit memory (adjust as needed)
            cpu: "1" # Limit CPU (adjust as needed)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-server
  template:
    metadata:
      labels:
        app: argocd-server
    spec:
      containers:
      - name: argocd-server
        image: argoproj/argocd:v2.5.2 # Replace with your ArgoCD version or image if required
        ports:
        - containerPort: 9090
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-repo-server
  template:
    metadata:
      labels:
        app: argocd-repo-server
    spec:
      containers:
      - name: argocd-repo-server
        image: argoproj/argocd:v2.5.2 # Replace with your ArgoCD version or image if required
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
